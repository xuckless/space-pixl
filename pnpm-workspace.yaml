# pnpm settings (pnpm ≥ 11 reads these from here, not package.json).
# Dependencies allowed to run install scripts. Nothing else may.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
# pnpm's supply-chain delay (minimumReleaseAge) would refuse a freshly
# published engine for a day, including the automatic bump PR. Our own private
# scope is exempt; everything else keeps the delay.
minimumReleaseAgeExclude:
  - '@xuckless/*'
# Install the engine's platform package for both CPUs of the current OS, so
# the arm64 MacBook that builds the x64 app also has
# @xuckless/pixl-engine-darwin-x64. electron-builder keeps only the package
# matching --arch in each bundle.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
