name: Release Please

# On every push to main, release-please maintains a release PR that bumps
# package.json and CHANGELOG.md from conventional commits. Merging that PR
# creates the tag and GitHub release, and this workflow then builds and
# publishes the installers for it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please labels its PRs

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Prefer a PAT: a release PR opened by GITHUB_TOKEN gets no CI
          # checks, because pushes made with it trigger no workflows. The
          # release build is unaffected either way — it is called from this
          # run, not triggered by the tag.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
