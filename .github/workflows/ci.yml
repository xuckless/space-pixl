name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # read:packages PAT for @xuckless/pixl-engine on GitHub Packages
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          # electron-builder install-app-deps runs in postinstall; no binary needed
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec electron-vite build
