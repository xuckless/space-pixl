name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    # The engine binding is a private package on GitHub Packages, and secrets
    # are not handed to workflows triggered from forks, so a fork's PR could
    # not install anyway. Only this repository's own branches run CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@xuckless'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # read:packages PAT for @xuckless/pixl-engine on GitHub Packages
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          # electron-builder install-app-deps runs in postinstall; no binary needed
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec electron-vite build
