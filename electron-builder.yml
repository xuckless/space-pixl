# electron-builder configuration for Space Pixl.
# https://www.electron.build/configuration
appId: com.xuckless.spacepixl
productName: Space Pixl
copyright: Copyright © 2026 xuckless
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.github,release-please-config.json,.release-please-manifest.json}'

# Native addons cannot be loaded from inside the asar archive. The engine
# binding ships as `@xuckless/pixl-engine` plus one platform package
# (`@xuckless/pixl-engine-darwin-arm64`, `-darwin-x64`, `-win32-x64-msvc`)
# holding the `.node` file. electron-builder includes only the optional
# platform package matching the build's --arch, so per-arch builds each
# carry exactly one binary.
asarUnpack:
  - resources/**
  - '**/*.node'
  - 'node_modules/@xuckless/pixl-engine*/**'

# pnpm hoists nothing; electron-builder must follow the symlinks in
# node_modules/.pnpm to collect production dependencies.
npmRebuild: false
nodeGypRebuild: false

mac:
  category: public.app-category.photography
  target:
    # zip is what electron-updater downloads; dmg is what people install from.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set in the environment (electron-builder reads them).
  # The Developer ID certificate comes from CSC_LINK / CSC_KEY_PASSWORD.
  # Without those variables the build is unsigned and the updater will not
  # accept it — Squirrel.Mac refuses unsigned updates.
  notarize: true
  extendInfo:
    NSPhotoLibraryUsageDescription: Space Pixl reads your photos to measure how much space it can save.
    NSDesktopFolderUsageDescription: Space Pixl scans folders you choose for images.
    NSDocumentsFolderUsageDescription: Space Pixl scans folders you choose for images.
    NSDownloadsFolderUsageDescription: Space Pixl scans folders you choose for images.

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  executableName: space-pixl
  target:
    - target: nsis
      arch: [x64]
  # Windows signing is optional for now: when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # are set electron-builder signs; otherwise the installer ships unsigned and
  # SmartScreen warns on first launch. Auto-update still works unsigned.
  # To move to Azure Trusted Signing later, replace this with `azureSignOptions`.
  signtoolOptions:
    publisherName: xuckless

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
  # electron-updater installs silently and relaunches.
  differentialPackage: true

# Linux is a local testing target, not a shipped one: nothing publishes it and
# the engine ships no Linux platform package. `pnpm engine:linux` compiles the
# binding from the sibling pixl-engine checkout and drops the .node beside the
# installed package, where the engine's loader looks first; asarUnpack above
# then carries it into the build. AppImage runs anywhere (needs libfuse2), and
# dist/linux-unpacked/space-pixl runs straight from the tree.
linux:
  executableName: space-pixl
  category: Graphics
  icon: build/icon.png
  synopsis: Reclaim storage by re-encoding your photo library.
  target:
    - target: AppImage
      arch: [x64]

appImage:
  artifactName: ${name}-${version}-${arch}.${ext}

# Update assets live on the Cloudflare R2 bucket `shipment`. Two entries:
# the first (generic) is what gets compiled into the app as its update feed,
# because R2's S3 endpoint (*.r2.cloudflarestorage.com) only answers signed
# requests, while the bucket's public URL serves objects anonymously. The
# second (s3) is what electron-builder uploads through; a generic provider is
# never uploaded to. Publishing needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (an R2 API token) in the environment. The bucket and URLs are spelled out
# because electron-builder does not expand ${env.*} in this block (a first
# release went out addressed to the literal macro). The channel is derived
# from the version: 0.2.0 → latest.yml, 0.2.0-beta.1 → beta.yml, so
# prereleases never reach stable users.
publish:
  - provider: generic
    # Public bucket URL (r2.dev is rate-limited and meant for development;
    # swap in a custom domain attached to the bucket before wide release).
    url: https://pub-a43a48ef06ba489fb058d7378d921856.r2.dev/space-pixl
    # Cloudflare only honours single-range requests, so skip the multi-range
    # attempt electron-updater makes for differential downloads.
    useMultipleRangeRequest: false
  - provider: s3
    endpoint: https://cc84ce804f5409f094e6376fcc9fdb3b.r2.cloudflarestorage.com
    region: auto
    bucket: shipment
    path: /space-pixl
    # R2 has no object ACLs; visibility comes from the bucket's public access
    # setting. null stops the publisher sending an x-amz-acl header.
    acl: null
    forcePathStyle: true
